[project]
name = "sax2sheet"
version = "0.1.0"
description = "Local audio-to-saxophone-sheet-music transcription tool"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "yt-dlp>=2024.10.7",
    "basic-pitch[onnx]>=0.4.0",
    "onnxruntime>=1.19",
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy>=1.26,<2.0",
    "music21>=9.1",
    "setuptools<81",  # resampy (a basic-pitch dep) imports pkg_resources at runtime; removed in setuptools 81+
]

[project.optional-dependencies]
# CPU separation: works everywhere, no GPU driver/CUDA-version dependency.
separate = [
    "demucs>=4.0",
    "torch>=2.2",
]
# GPU separation: same deps, but torch resolves from PyTorch's CUDA wheel
# index instead of PyPI's CPU-only default (see [tool.uv.sources] below).
# Pick the extra matching your GPU/driver's supported CUDA version.
separate-gpu = [
    "demucs>=4.0",
    "torch>=2.2",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv]
package = true
# `separate` and `separate-gpu` both provide `torch` from different indices;
# without this, uv treats installing both together as ambiguous and errors.
conflicts = [
    [
        { extra = "separate" },
        { extra = "separate-gpu" },
    ],
]

[tool.uv.sources]
# Only torch resolves from the PyTorch index, and only under separate-gpu --
# everything else (including torch under the plain `separate` extra) still
# comes from PyPI. cu130 targets CUDA 13.0-class drivers (e.g. RTX 50-series
# Blackwell GPUs); swap the index below for your CUDA version if different --
# see https://download.pytorch.org/whl/torch/ for available cuNNN indices.
torch = { index = "pytorch-cu130", extra = "separate-gpu" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sax2sheet"]
