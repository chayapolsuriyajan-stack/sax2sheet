[project]
name = "sax2sheet"
version = "0.1.0"
description = "Local audio-to-saxophone-sheet-music transcription tool"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "yt-dlp>=2024.10.7",
    "basic-pitch[onnx]>=0.4.0",
    "onnxruntime>=1.19",
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy>=1.26,<2.0",
    "music21>=9.1",
    "setuptools<81",  # resampy (a basic-pitch dep) imports pkg_resources at runtime; removed in setuptools 81+
]

[project.optional-dependencies]
separate = [
    "demucs>=4.0",
    "torch>=2.2",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sax2sheet"]
